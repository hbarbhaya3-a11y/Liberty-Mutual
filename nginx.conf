server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # gzip text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # Cache fingerprinted assets aggressively
    location /assets/ {
        include /etc/nginx/snippets/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — every unknown path serves index.html so React Router (BrowserRouter)
    # handles client-side routing. We also force no-store on the HTML shell here so a
    # new deploy is picked up immediately while hashed /assets/* stay cached for a year.
    location / {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfile access (allow .well-known for future ACME / verification)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
