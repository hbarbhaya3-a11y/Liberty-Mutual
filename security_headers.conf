# Security response headers — included into every location block.
# nginx's add_header is NOT inherited into a child block that defines its own
# add_header, so we include this snippet everywhere instead of relying on
# server-level inheritance.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# CSP: Vite-built React needs inline styles (style attributes) at runtime;
# scripts are bundled so script-src stays 'self'. Google Fonts in index.html
# requires fonts.googleapis.com (stylesheet) and fonts.gstatic.com (font files).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
